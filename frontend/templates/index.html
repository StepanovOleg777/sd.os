<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ app_name }}</title>

    <script>
        (() => {
            const savedTheme = localStorage.getItem("sdos-theme");

            if (savedTheme === "light" || savedTheme === "dark") {
                document.documentElement.dataset.theme = savedTheme;
            } else {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}"
    >
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                <img
                    src="/static/img/stroydvor.png"
                    alt="СтройДвор"
                >
            </div>

            <div class="brand-text">

                <span class="brand-name">
                    SD.OS
                </span>

                <span class="brand-version">
                    v{{ app_version }}
                </span>

            </div>

        </div>


        <div class="topbar-actions">

            <div
                class="current-user"
                title="{{ user.fio }}"
            >
                {{ user.fio }}
            </div>


            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
                aria-label="Сменить тему"
                title="Сменить тему"
            >
                <span
                    id="theme-icon"
                    class="theme-icon"
                    aria-hidden="true"
                ></span>
            </button>


            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>


            <button
                type="button"
                id="logout-button"
                class="logout-button"
                aria-label="Выйти"
                title="Выйти из SD.OS"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M10 17v-2h4V9h-4V7l-5 5 5 5Zm1-14h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8v-2h8V5h-8V3Z"
                    />
                </svg>

                <span>
                    Выйти
                </span>
            </button>

        </div>

    </header>


    <main class="chat">

        <section
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                <img
                    src="/static/img/stroydvor.png"
                    alt="СтройДвор"
                >
            </div>

            <h1>
                Цифровое ядро компании
            </h1>

        </section>


        <section
            id="messages"
            class="messages"
        ></section>


        <div class="composer-wrapper">

            <form
                id="chat-form"
                class="composer"
            >

                <textarea
                    id="message-input"
                    placeholder="Спросите о работе компании..."
                    rows="1"
                    maxlength="10000"
                    autocomplete="off"
                ></textarea>


                <button
                    type="button"
                    id="voice-button"
                    class="icon-button"
                    aria-label="Голосовой ввод"
                    title="Голосовой ввод"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-2Z"
                        />
                    </svg>
                </button>


                <button
                    type="submit"
                    id="send-button"
                    class="send-button"
                    aria-label="Отправить"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9v6.6Z"
                        />
                    </svg>
                </button>

            </form>


            <div class="composer-hint">
                SD.OS может ошибаться. Важные решения требуют проверки.
            </div>

        </div>

    </main>

</div>


<script
    src="{{ url_for('static', path='/js/app.js') }}"
></script>


<script>
    (() => {
        const toggle = document.getElementById("theme-toggle");
        const icon = document.getElementById("theme-icon");

        function updateThemeIcon() {
            const theme =
                document.documentElement.dataset.theme || "dark";

            icon.textContent =
                theme === "dark"
                    ? "☀"
                    : "☾";
        }

        updateThemeIcon();

        toggle.addEventListener("click", () => {
            const currentTheme =
                document.documentElement.dataset.theme || "dark";

            const nextTheme =
                currentTheme === "dark"
                    ? "light"
                    : "dark";

            document.documentElement.dataset.theme = nextTheme;

            localStorage.setItem(
                "sdos-theme",
                nextTheme
            );

            updateThemeIcon();
        });
    })();


    (() => {
        const logoutButton =
            document.getElementById("logout-button");

        logoutButton.addEventListener(
            "click",
            async () => {
                logoutButton.disabled = true;

                try {
                    const response = await fetch(
                        "/api/auth/logout",
                        {
                            method: "POST",
                        }
                    );

                    if (!response.ok) {
                        logoutButton.disabled = false;
                        return;
                    }

                    window.location.href = "/login";

                } catch (error) {
                    logoutButton.disabled = false;
                }
            }
        );
    })();
</script>

</body>
</html>
