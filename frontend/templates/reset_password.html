<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Новый пароль — SD.OS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: #fff;
        }

        .box {
            width: 100%;
            max-width: 420px;

            padding: 32px;

            border: 1px solid #333;
            border-radius: 14px;

            background: #181818;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;

            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #222;
            color: #fff;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: 0;
            border-radius: 8px;

            background: #fff;
            color: #111;

            font-size: 16px;
            cursor: pointer;
        }

        .error {
            margin-bottom: 18px;

            color: #ff7777;

            text-align: center;
            line-height: 1.5;
        }

        .success {
            padding: 14px;

            border: 1px solid #2b5b3d;
            border-radius: 8px;

            background: #17271d;
            color: #d7efdf;

            line-height: 1.5;
            text-align: center;
        }

        .login-link {
            display: block;

            margin-top: 20px;

            color: #fff;

            text-align: center;
            text-decoration: none;
        }

        .note {
            margin-bottom: 18px;

            color: #aaa;

            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>
        Новый пароль
    </h1>


    {% if success %}

        <div class="success">
            Пароль успешно изменён.
            Все предыдущие сеансы SD.OS завершены.
        </div>

        <a
            class="login-link"
            href="/login"
        >
            Войти в SD.OS
        </a>


    {% elif error %}

        <div class="error">
            {{ error }}
        </div>

        <a
            class="login-link"
            href="/forgot-password"
        >
            Запросить новую ссылку
        </a>


    {% else %}

        <div class="note">
            Новый пароль должен содержать
            минимум 10 символов.
        </div>

        <form
            method="post"
            action="/reset-password/{{ token }}"
        >

            <div class="field">

                <label for="password">
                    Новый пароль
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="10"
                    required
                >

            </div>


            <div class="field">

                <label for="password-confirm">
                    Повторите пароль
                </label>

                <input
                    id="password-confirm"
                    name="password_confirm"
                    type="password"
                    autocomplete="new-password"
                    minlength="10"
                    required
                >

            </div>


            <button type="submit">
                Сохранить новый пароль
            </button>

        </form>

    {% endif %}

</div>

</body>
</html>
