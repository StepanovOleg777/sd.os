<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Восстановление пароля — SD.OS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: #fff;
        }

        .box {
            width: 100%;
            max-width: 420px;

            padding: 32px;

            border: 1px solid #333;
            border-radius: 14px;

            background: #181818;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;

            text-align: center;
        }

        .description {
            margin-bottom: 24px;

            color: #aaa;

            text-align: center;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #222;
            color: #fff;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: 0;
            border-radius: 8px;

            background: #fff;
            color: #111;

            font-size: 16px;
            cursor: pointer;
        }

        .error {
            margin-bottom: 18px;

            color: #ff7777;

            text-align: center;
            line-height: 1.5;
        }

        .success {
            margin-bottom: 18px;

            padding: 14px;

            border: 1px solid #2b5b3d;
            border-radius: 8px;

            background: #17271d;
            color: #d7efdf;

            line-height: 1.5;
        }

        .back {
            display: block;

            margin-top: 20px;

            color: #aaa;

            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>
        Восстановление пароля
    </h1>

    <div class="description">
        Укажите email, связанный
        с вашей учётной записью SD.OS.
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% else %}

        <form
            method="post"
            action="/forgot-password"
        >

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >

            </div>

            <button type="submit">
                Получить ссылку
            </button>

        </form>

    {% endif %}


    <a
        class="back"
        href="/login"
    >
        ← Вернуться ко входу
    </a>

</div>

</body>
</html>
