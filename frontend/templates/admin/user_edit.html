<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Изменение пользователя — SD.OS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111214;
            color: #f2f2f2;
        }

        .container {
            width: 100%;
            max-width: 620px;

            margin: 0 auto;
        }

        .back {
            display: inline-block;

            margin-bottom: 24px;

            color: #96999f;
            text-decoration: none;
        }

        h1 {
            margin:
                0
                0
                28px;

            font-size: 26px;
        }

        .field {
            margin-bottom: 20px;
        }

        label.field-label {
            display: block;

            margin-bottom: 7px;

            color: #96999f;

            font-size: 13px;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #2b2d31;
            border-radius: 10px;

            outline: 0;

            background: #17181b;
            color: #f2f2f2;

            font-size: 15px;
        }

        .readonly {
            color: #65686e;
        }

        .roles {
            padding: 15px;

            border: 1px solid #2b2d31;
            border-radius: 10px;

            background: #17181b;
        }

        .role {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 10px;

            color: #f2f2f2;
        }

        .role:last-child {
            margin-bottom: 0;
        }

        .status-note {
            margin-top: 8px;

            color: #65686e;

            font-size: 12px;
            line-height: 1.5;
        }

        .error {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 9px;

            background: #3a2024;
            color: #ff9aa0;
        }

        .save-button {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: 0;
            border-radius: 10px;

            background: #7277ff;
            color: #ffffff;

            font-size: 15px;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <a
        class="back"
        href="/admin/users"
    >
        ← Пользователи
    </a>


    <h1>
        Изменение пользователя
    </h1>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="post"
        action="/admin/users/{{ edited_user.id }}/edit"
    >

        <div class="field">

            <label
                class="field-label"
                for="fio"
            >
                ФИО
            </label>

            <input
                id="fio"
                name="fio"
                type="text"
                value="{{ edited_user.fio }}"
                required
            >

        </div>


        <div class="field">

            <label
                class="field-label"
                for="email"
            >
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                value="{{ edited_user.email }}"
                required
            >

        </div>


        <div class="field">

            <label class="field-label">
                Логин
            </label>

            <input
                class="readonly"
                type="text"
                value="{{ edited_user.username or 'Ещё не создан' }}"
                readonly
            >

        </div>


        <div class="field">

            <label class="field-label">
                Роли
            </label>

            <div class="roles">

                {% for role in roles %}

                    <label class="role">

                        <input
                            type="checkbox"
                            name="roles"
                            value="{{ role.code }}"
                            {% if role.id in selected_role_ids %}
                                checked
                            {% endif %}
                        >

                        <span>
                            {{ role.name }}
                        </span>

                    </label>

                {% endfor %}

            </div>

        </div>


        <div class="field">

            <label
                class="field-label"
                for="account-status"
            >
                Статус
            </label>

            <select
                id="account-status"
                name="account_status"
            >

                <option
                    value="active"
                    {% if edited_user.status == "active" %}
                        selected
                    {% endif %}
                >
                    Активен
                </option>

                <option
                    value="invited"
                    {% if edited_user.status == "invited" %}
                        selected
                    {% endif %}
                >
                    Приглашён
                </option>

                <option
                    value="disabled"
                    {% if edited_user.status == "disabled" %}
                        selected
                    {% endif %}
                >
                    Отключён
                </option>

                <option
                    value="dismissed"
                    {% if edited_user.status == "dismissed" %}
                        selected
                    {% endif %}
                >
                    Уволен
                </option>

            </select>

            <div class="status-note">
                «Отключён» — временно запрещает доступ к SD.OS.
                «Уволен» — отключает доступ и переносит пользователя
                в раздел «Архив».
            </div>

        </div>


        <button
            type="submit"
            class="save-button"
        >
            Сохранить изменения
        </button>

    </form>

</div>

</body>
</html>
